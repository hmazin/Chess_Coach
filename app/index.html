<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Practice chess opening variations against an offline opponent.">
  <meta name="theme-color" content="#171b18">
  <title>Chess Coach</title>
  <link rel="icon" type="image/svg+xml" href="assets/pieces/wN.svg">
  <link rel="apple-touch-icon" href="assets/icons/chess-coach-180.png">
  <link rel="stylesheet" href="styles.css">
  <script defer src="repertoire.js"></script>
  <script defer src="lesson-data.js"></script>
  <script defer src="concepts.js"></script>
  <script defer src="coach.js"></script>
  <script defer src="trainer.js"></script>
  <script defer src="pwa.js"></script>
</head>
<body>
  <div class="shell" id="chess-coach">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon"><img src="assets/pieces/wN.svg" alt=""></div>
        <div>
          <h1>Chess Coach</h1>
          <p>Opening lessons and blitz practice</p>
        </div>
      </div>
      <div class="app-actions">
        <span class="offline" role="status"><span aria-hidden="true"></span><span data-offline-status>Offline practice</span></span>
        <button class="install-button" type="button" data-install hidden>Install app</button>
        <button class="install-button" type="button" data-update hidden>Update app</button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel setup-panel" aria-labelledby="setup-title">
        <h2 id="setup-title">Practice setup</h2>
        <label>
          Opening
          <select data-opening></select>
        </label>
        <label>
          Practice mode
          <select data-mode aria-describedby="mode-description">
            <option value="learn">Learn concepts</option>
            <option value="mixed">Mix replies</option>
            <option value="study">Choose a variation</option>
            <option value="review">Review missed moves</option>
          </select>
        </label>
        <p class="secondary" id="mode-description" data-mode-description></p>
        <label data-line-control hidden>
          <span data-line-label>Variation</span>
          <select data-line></select>
        </label>
        <div class="opening-progress">
          <div class="progress-label">
            <label for="coverage">Variations practiced</label>
            <span data-coverage></span>
          </div>
          <progress id="coverage" value="0" max="1"></progress>
          <p class="secondary" data-review-count></p>
        </div>
      </section>

      <section class="panel board-panel" aria-labelledby="opening-title">
        <div class="board-heading">
          <div>
            <p class="eyebrow">Practice board</p>
            <h2 id="opening-title" data-opening-title></h2>
          </div>
          <p class="turn-badge" aria-live="polite" data-turn></p>
        </div>
        <p class="board-question" data-board-question hidden></p>
        <div class="board-stage">
          <div class="board" role="group" aria-label="Chessboard" data-board></div>
          <svg class="board-arrows" viewBox="0 0 8 8" aria-hidden="true">
            <defs>
              <marker id="idea-arrow" markerWidth=".42" markerHeight=".42" markerUnits="userSpaceOnUse" refX="5" refY="3" viewBox="0 0 6 6" orient="auto">
                <path class="idea-arrowhead" d="M0 0 L6 3 L0 6 Z"/>
              </marker>
              <marker id="threat-arrow" markerWidth=".42" markerHeight=".42" markerUnits="userSpaceOnUse" refX="5" refY="3" viewBox="0 0 6 6" orient="auto">
                <path class="threat-arrowhead" d="M0 0 L6 3 L0 6 Z"/>
              </marker>
            </defs>
            <g data-board-arrows></g>
          </svg>
        </div>
        <div class="board-footer">
          <p data-board-instructions>Choose a piece, then its destination.</p>
          <p class="step" data-step></p>
        </div>
      </section>

      <section class="panel coach-panel" aria-labelledby="coach-title">
        <h2 id="coach-title">Coach</h2>
        <h3 class="lesson-title" data-lesson-title hidden></h3>
        <div class="lesson-choices" role="group" aria-label="Lesson choices" data-lesson-choices hidden></div>
        <p class="feedback" aria-live="polite" data-feedback></p>
        <div class="coach-actions">
          <button class="action" type="button" data-action>Hint</button>
          <button class="action secondary-action" type="button" data-learn>Learn the idea</button>
        </div>
        <details class="ai-coach" data-ai-coach>
          <summary>Ask the AI coach</summary>
          <p class="secondary" data-ai-position></p>
          <p class="secondary" role="status" data-ai-status></p>
          <form class="ai-form" data-ai-unlock hidden>
            <label>
              Private coach access code
              <input data-ai-code type="password" maxlength="100" autocomplete="current-password" required>
            </label>
            <button class="action" type="submit">Unlock coach</button>
          </form>
          <div data-ai-chat hidden>
            <div class="ai-turns" role="log" aria-live="polite" data-ai-turns></div>
            <form class="ai-form" data-ai-form>
              <label>
                Your question about this position
                <textarea data-ai-question rows="3" maxlength="900" placeholder="What is White threatening here?" required></textarea>
              </label>
              <div class="coach-actions">
                <button class="action" data-ai-send type="submit">Ask coach</button>
                <button class="action secondary-action" data-ai-why type="button" hidden>Why not my move?</button>
              </div>
            </form>
            <p class="secondary">Your question and this position are sent to an OpenAI model.</p>
          </div>
        </details>
        <div class="move-history">
          <h3>Move history</h3>
          <p data-moves></p>
        </div>
        <p class="secondary" role="status" data-storage-warning hidden>Progress is available for this session.</p>
      </section>
    </main>
    <noscript>Enable JavaScript in your browser to play Chess Coach.</noscript>
  </div>
</body>
</html>
